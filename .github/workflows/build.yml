name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  # Change to your fork if you want to use it, e.g. https://github.com/GodarmX/hev-socks5-tunnel
  HEV_REPO: https://github.com/heiher/hev-socks5-tunnel

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build hev-socks5-tunnel (native .so)
        run: |
          mkdir -p hev
          git clone --recursive --depth 1 --shallow-submodules "$HEV_REPO" hev/jni
          cd hev
          "$ANDROID_NDK_HOME/ndk-build" NDK_PROJECT_PATH=. \
            APP_BUILD_SCRIPT=jni/Android.mk NDK_APPLICATION_MK=jni/Application.mk -j"$(nproc)"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            mkdir -p ../app/src/main/jniLibs/$abi
            cp libs/$abi/libhev-socks5-tunnel.so ../app/src/main/jniLibs/$abi/
          done

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: ssh-tunnel-debug-apk
          path: app/build/outputs/apk/debug/*.apk
